[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobspy-lite"
version = "0.1.0"
description = "Indeed, LinkedIn, Arbeitsagentur and StepStone job scrapers, without pandas"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["jobs", "scraper", "indeed", "linkedin", "stepstone", "arbeitsagentur"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "beautifulsoup4>=4.12.2",
    "curl_cffi>=0.7.0",
    "markdownify>=1.1.0",
    "pydantic>=2.3.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/koztix/jobspy-lite"
Repository = "https://github.com/koztix/jobspy-lite"
Issues = "https://github.com/koztix/jobspy-lite/issues"

[project.optional-dependencies]
dev = ["pytest>=8.3", "build>=1.2"]

[project.scripts]
jobspy-lite = "jobspy_lite.cli:main"

[tool.setuptools.packages.find]
include = ["jobspy_lite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
